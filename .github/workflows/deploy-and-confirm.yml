name: Deploy and Confirm Beat Tap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-and-confirm.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-confirm
  cancel-in-progress: true

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Galaxy Tab PWA features
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, struct, zlib, binascii

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>Beat Tap v1.6</title>', '<title>Beat Tap v1.8 Tablet PWA</title>')
          s = s.replace('<title>Beat Tap v1.7</title>', '<title>Beat Tap v1.8 Tablet PWA</title>')

          if 'manifest.webmanifest' not in s:
              s = s.replace('</head>', '<link rel="manifest" href="./manifest.webmanifest">\n<meta name="theme-color" content="#17142e">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-capable" content="yes">\n</head>')

          marker = '/* BEAT_TAP_TABLET_PWA_V18 */'
          if marker not in s:
              css = r'''<style>
/* BEAT_TAP_TABLET_PWA_V18 */
html,body{overscroll-behavior:none;touch-action:manipulation;background:#090713}
#pwaInstallBtn,#fullscreenBtn{position:fixed;z-index:9999;right:18px;border:0;border-radius:18px;padding:14px 18px;font-weight:900;color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.35)}
#pwaInstallBtn{bottom:22px;background:linear-gradient(135deg,#a844ff,#7047ff)}
#fullscreenBtn{bottom:82px;background:rgba(32,27,58,.92);border:1px solid rgba(255,255,255,.12)}
#pwaInstallBtn[hidden],#fullscreenBtn[hidden]{display:none!important}
@media (min-width:760px){
  .screen:not(.game-screen){max-width:980px!important}
  .character-card .avatar{height:170px!important}
  .song-card{min-height:84px}
  .big-action{min-height:82px;font-size:22px}
  .difficulty-card{min-height:78px;font-size:18px}
}
@media (min-width:900px) and (orientation:landscape){
  .game-screen.active{grid-template-rows:82px 1fr 210px!important;height:100dvh}
  .control-pad{gap:16px!important;padding:14px 18px max(16px,env(safe-area-inset-bottom))!important}
  .dir-btn{min-height:180px!important;font-size:112px!important;border-radius:34px!important}
  .note{height:136px!important;font-size:122px!important}
  .character-avatar-img{height:min(48vh,430px)!important;max-width:min(42vw,360px)!important}
  .hit-line{bottom:92px!important}
  .receptors{bottom:20px!important}
  .game-hud{padding-left:22px!important;padding-right:22px!important}
}
@media (min-width:760px) and (orientation:portrait){
  .game-screen.active{grid-template-rows:88px 1fr 230px!important;height:100dvh}
  .dir-btn{min-height:195px!important;font-size:108px!important}
  .note{height:132px!important;font-size:118px!important}
}
.character-stage .character-avatar-img{transform-origin:50% 88%;will-change:transform}
.character-stage.dance-boy.beat-a .character-avatar-img{animation:bd1 .36s ease-out!important}.character-stage.dance-boy.beat-b .character-avatar-img{animation:bd2 .36s ease-out!important}
.character-stage.dance-woman.beat-a .character-avatar-img{animation:wd1 .38s ease-out!important}.character-stage.dance-woman.beat-b .character-avatar-img{animation:wd2 .38s ease-out!important}
.character-stage.dance-man.beat-a .character-avatar-img{animation:md1 .38s ease-out!important}.character-stage.dance-man.beat-b .character-avatar-img{animation:md2 .38s ease-out!important}
.character-stage.hit-pop .character-avatar-img{animation:hp .2s ease-out!important}
.character-stage:not(.beat-a):not(.beat-b):not(.hit-pop) .character-avatar-img{animation:idlemove 1.6s ease-in-out infinite}
@keyframes bd1{0%{transform:translate(0,0)}45%{transform:translate(-22px,-16px) rotate(-5deg) scale(1.045)}100%{transform:translate(0,0)}}
@keyframes bd2{0%{transform:translate(0,0)}45%{transform:translate(22px,-28px) rotate(5deg) scale(1.055)}100%{transform:translate(0,0)}}
@keyframes wd1{0%{transform:translate(0,0)}45%{transform:translate(-24px,-8px) rotate(-7deg) scale(1.03)}100%{transform:translate(0,0)}}
@keyframes wd2{0%{transform:translate(0,0)}45%{transform:translate(24px,-12px) rotate(7deg) scale(1.035)}100%{transform:translate(0,0)}}
@keyframes md1{0%{transform:translate(0,0)}45%{transform:translate(-18px,-10px) rotate(-3deg) scale(1.03)}100%{transform:translate(0,0)}}
@keyframes md2{0%{transform:translate(0,0)}45%{transform:translate(18px,-22px) rotate(3deg) scale(1.04)}100%{transform:translate(0,0)}}
@keyframes hp{0%{transform:scale(1)}45%{transform:translateY(-14px) scale(1.1)}100%{transform:scale(1)}}
@keyframes idlemove{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-5px) rotate(.4deg) scale(1.01)}}
</style>'''
              js = r'''<script>
(() => {
  let deferredPrompt = null;
  let wakeLock = null;
  const installed = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  const installBtn = document.createElement('button');
  installBtn.id = 'pwaInstallBtn';
  installBtn.textContent = '앱 설치';
  installBtn.hidden = true;

  const fsBtn = document.createElement('button');
  fsBtn.id = 'fullscreenBtn';
  fsBtn.textContent = '전체화면';
  fsBtn.hidden = installed();

  document.body.append(installBtn, fsBtn);

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if (!installed()) installBtn.hidden = false;
  });

  window.addEventListener('appinstalled', () => {
    installBtn.hidden = true;
    deferredPrompt = null;
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) {
      alert('Chrome 메뉴에서 “앱 설치” 또는 “홈 화면에 추가”를 선택해 주세요.');
      return;
    }
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch(e) {}
    installBtn.hidden = true;
    deferredPrompt = null;
  });

  fsBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch(e) {}
  });

  async function keepAwake(){
    if (!('wakeLock' in navigator)) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
  }
  async function releaseAwake(){
    try { if (wakeLock) await wakeLock.release(); } catch(e) {}
    wakeLock = null;
  }

  ['playBtn','retryBtn'].forEach(id => document.getElementById(id)?.addEventListener('click', keepAwake));
  ['quitBtn','selectAgainBtn'].forEach(id => document.getElementById(id)?.addEventListener('click', releaseAwake));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && document.getElementById('gameScreen')?.classList.contains('active')) keepAwake();
  });

  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
})();
</script>'''
              s = s.replace('</head>', css + '\n</head>')
              s = s.replace('</body>', js + '\n</body>')

          p.write_text(s, encoding='utf-8')

          manifest = {
            'name':'Beat Tap Rhythm Game',
            'short_name':'Beat Tap',
            'id':'/beattop/',
            'start_url':'/beattop/',
            'scope':'/beattop/',
            'display':'standalone',
            'orientation':'any',
            'background_color':'#090713',
            'theme_color':'#17142e',
            'description':'Galaxy Tab optimized 4-direction rhythm game',
            'icons':[
              {'src':'./icon-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
              {'src':'./icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')

          sw = r'''const CACHE='beat-tap-tablet-v18';
const CORE=['./','./index.html','./manifest.webmanifest','./icon-192.png','./icon-512.png'];
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting())));
self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return; if(e.request.mode==='navigate'){e.respondWith(fetch(e.request).then(r=>{const x=r.clone();caches.open(CACHE).then(c=>c.put('./index.html',x));return r}).catch(()=>caches.match('./index.html')));return;} e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});'''
          Path('sw.js').write_text(sw,encoding='utf-8')

          def png(size, path):
              w=h=size
              raw=bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      cx,cy=w/2,h/2
                      r=((x-cx)**2+(y-cy)**2)**0.5
                      if r < size*0.34: color=(153,75,255,255)
                      else: color=(13,11,29,255)
                      raw.extend(color)
              def chunk(tag,data):
                  return struct.pack('>I',len(data))+tag+data+struct.pack('>I',binascii.crc32(tag+data)&0xffffffff)
              data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),9))+chunk(b'IEND',b'')
              Path(path).write_bytes(data)
          png(192,'icon-192.png')
          png(512,'icon-512.png')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        if: success()
        run: |
          printf 'Beat Tap v1.8 Tablet PWA deployed successfully\n%s\n' '${{ steps.deployment.outputs.page_url }}' > DEPLOYED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYED.txt
          git commit -m 'Confirm Beat Tap v1.8 Tablet PWA deployment [skip ci]' || exit 0
          git push
