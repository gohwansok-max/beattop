name: Deploy and Confirm Beat Tap

on:
  push:
    paths:
      - '.github/workflows/deploy-and-confirm.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-confirm
  cancel-in-progress: true

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make character movement stronger for deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Beat Tap v1.6</title>','<title>Beat Tap v1.7</title>')
          marker='/* BEAT_TAP_DEPLOY_DANCE */'
          if marker not in s:
              css='''<style>\n/* BEAT_TAP_DEPLOY_DANCE */\n.character-stage .character-avatar-img{transform-origin:50% 88%;will-change:transform}\n.character-stage.dance-boy.beat-a .character-avatar-img{animation:bd1 .36s ease-out!important}.character-stage.dance-boy.beat-b .character-avatar-img{animation:bd2 .36s ease-out!important}\n.character-stage.dance-woman.beat-a .character-avatar-img{animation:wd1 .38s ease-out!important}.character-stage.dance-woman.beat-b .character-avatar-img{animation:wd2 .38s ease-out!important}\n.character-stage.dance-man.beat-a .character-avatar-img{animation:md1 .38s ease-out!important}.character-stage.dance-man.beat-b .character-avatar-img{animation:md2 .38s ease-out!important}\n.character-stage.hit-pop .character-avatar-img{animation:hp .2s ease-out!important}\n.character-stage:not(.beat-a):not(.beat-b):not(.hit-pop) .character-avatar-img{animation:idlemove 1.6s ease-in-out infinite}\n@keyframes bd1{0%{transform:translate(0,0)}45%{transform:translate(-22px,-16px) rotate(-5deg) scale(1.045)}100%{transform:translate(0,0)}}\n@keyframes bd2{0%{transform:translate(0,0)}45%{transform:translate(22px,-28px) rotate(5deg) scale(1.055)}100%{transform:translate(0,0)}}\n@keyframes wd1{0%{transform:translate(0,0)}45%{transform:translate(-24px,-8px) rotate(-7deg) scale(1.03)}100%{transform:translate(0,0)}}\n@keyframes wd2{0%{transform:translate(0,0)}45%{transform:translate(24px,-12px) rotate(7deg) scale(1.035)}100%{transform:translate(0,0)}}\n@keyframes md1{0%{transform:translate(0,0)}45%{transform:translate(-18px,-10px) rotate(-3deg) scale(1.03)}100%{transform:translate(0,0)}}\n@keyframes md2{0%{transform:translate(0,0)}45%{transform:translate(18px,-22px) rotate(3deg) scale(1.04)}100%{transform:translate(0,0)}}\n@keyframes hp{0%{transform:scale(1)}45%{transform:translateY(-14px) scale(1.1)}100%{transform:scale(1)}}\n@keyframes idlemove{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-5px) rotate(.4deg) scale(1.01)}}\n</style>'''
              s=s.replace('</head>',css+'\n</head>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        if: success()
        run: |
          printf 'Beat Tap v1.7 deployed successfully\n%s\n' '${{ steps.deployment.outputs.page_url }}' > DEPLOYED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYED.txt
          git commit -m 'Confirm Beat Tap v1.7 Pages deployment [skip ci]' || exit 0
          git push
